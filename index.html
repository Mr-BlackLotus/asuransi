<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Asuransi</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7385; --line:#dfe3ee;
    --primary:#1a56db; --primary-d:#1445b3; --ok:#0f8a4b; --warn:#b45309; --err:#c81e1e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.25rem; margin:8px 0 2px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=tel] {
    width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text);
  }
  input:focus { outline:2px solid var(--primary); border-color:transparent; }
  .rp { position:relative; }
  .rp span { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; }
  .rp input { padding-left:42px; }
  .photo-box {
    border:2px dashed var(--line); border-radius:12px; padding:16px; text-align:center; color:var(--muted); cursor:pointer;
  }
  .photo-box img { max-width:100%; max-height:260px; border-radius:8px; display:block; margin:0 auto 8px; }
  .photo-box.has { border-style:solid; }
  button {
    width:100%; margin-top:18px; padding:14px; font-size:1rem; font-weight:700; color:#fff;
    background:var(--primary); border:0; border-radius:10px; cursor:pointer;
  }
  button:hover { background:var(--primary-d); }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:10px; font-size:.9rem; display:none; }
  .msg.ok { display:block; background:#e6f6ee; color:var(--ok); }
  .msg.err { display:block; background:#fdecec; color:var(--err); }
  .msg.warn { display:block; background:#fff4e0; color:var(--warn); }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .head h2 { font-size:1rem; margin:0; }
  .head a { font-size:.85rem; color:var(--primary); text-decoration:none; }
  .item { padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem; }
  .item:last-child { border-bottom:0; }
  .item b { font-size:1rem; }
  .item .meta { color:var(--muted); font-size:.8rem; }
  .empty { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Report Asuransi</h1>
  <div class="sub">Data yang diinput langsung masuk ke Google Sheet.</div>

  <form id="form" class="card" autocomplete="off">
    <label>Foto</label>
    <div class="photo-box" id="photoBox">
      <div id="photoHint">Ketuk untuk ambil foto / pilih dari galeri</div>
    </div>
    <input type="file" id="photo" accept="image/*" hidden>

    <label for="nominal">Nominal</label>
    <div class="rp"><span>Rp</span><input type="tel" id="nominal" inputmode="numeric" placeholder="0" required></div>

    <label for="noMP">No Pesanan MP</label>
    <input type="text" id="noMP" placeholder="mis. 2410150ABCDEF" required>

    <label for="noEK">No Invoice EK</label>
    <input type="text" id="noEK" placeholder="mis. EK-123456" required>

    <button type="submit" id="btn">Simpan ke Sheet</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="card">
    <div class="head">
      <h2>Data terakhir <span id="total" class="meta"></span></h2>
      <a href="https://docs.google.com/spreadsheets/d/14FIH5zkBPqYbOO_vi2Hgx-R1HBgmnmQPeAjnm6S8Mtw/edit" target="_blank" rel="noopener">Buka Sheet</a>
    </div>
    <div id="list" class="empty">Memuat…</div>
  </div>
</div>

<script>
  var photoData = null; // {base64, mime}
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Foto ----------
  $('photoBox').addEventListener('click', function () { $('photo').click(); });
  $('photo').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    compressImage(f, 1280, 0.8).then(function (res) {
      photoData = res;
      var box = $('photoBox');
      box.classList.add('has');
      box.innerHTML = '<img src="' + res.dataUrl + '" alt="Foto"><div>Ketuk untuk ganti foto</div>';
    }).catch(function () { show('Foto tidak bisa dibaca, coba foto lain.', 'err'); });
  });

  function compressImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var w = img.width, h = img.height, s = Math.min(1, maxSide / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var dataUrl = c.toDataURL('image/jpeg', quality);
          resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Nominal (format ribuan) ----------
  $('nominal').addEventListener('input', function () {
    var d = this.value.replace(/\D/g, '');
    this.value = d ? Number(d).toLocaleString('id-ID') : '';
  });
  function nominalValue() { return Number($('nominal').value.replace(/\D/g, '')); }
  function rupiah(n) { return 'Rp' + Number(n).toLocaleString('id-ID'); }

  // ---------- Pesan ----------
  function show(text, type) {
    var m = $('msg'); m.textContent = text; m.className = 'msg ' + type;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---------- Simpan ----------
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('msg').className = 'msg';
    if (!photoData) return show('Foto wajib diisi.', 'err');
    var nominal = nominalValue();
    if (!nominal) return show('Nominal wajib diisi.', 'err');
    var noMP = $('noMP').value.trim(), noEK = $('noEK').value.trim();
    if (!noMP || !noEK) return show('No Pesanan MP dan No Invoice EK wajib diisi.', 'err');

    $('btn').disabled = true; $('btn').textContent = 'Memeriksa…';

    google.script.run
      .withFailureHandler(fail)
      .withSuccessHandler(function (dup) {
        if (dup.mp || dup.ek) {
          var what = (dup.mp ? 'No Pesanan MP' : '') + (dup.mp && dup.ek ? ' dan ' : '') + (dup.ek ? 'No Invoice EK' : '');
          if (!confirm(what + ' ini sudah pernah diinput. Tetap simpan?')) {
            reset(); return show('Dibatalkan, data tidak disimpan.', 'warn');
          }
        }
        $('btn').textContent = 'Mengunggah…';
        google.script.run
          .withFailureHandler(fail)
          .withSuccessHandler(function () {
            show('Tersimpan ke Google Sheet ✔', 'ok');
            $('form').reset(); photoData = null;
            $('photoBox').classList.remove('has');
            $('photoBox').innerHTML = '<div id="photoHint">Ketuk untuk ambil foto / pilih dari galeri</div>';
            reset(); loadRecent();
          })
          .saveEntry({ nominal: nominal, noMP: noMP, noEK: noEK, photoBase64: photoData.base64, mime: photoData.mime });
      })
      .checkDuplicate(noMP, noEK);
  });

  function reset() { $('btn').disabled = false; $('btn').textContent = 'Simpan ke Sheet'; }
  function fail(err) { reset(); show('Gagal menyimpan: ' + (err && err.message ? err.message : err), 'err'); }

  // ---------- Data terakhir ----------
  function loadRecent() {
    google.script.run.withFailureHandler(function () {
      $('list').textContent = 'Tidak bisa memuat data.';
    }).withSuccessHandler(function (res) {
      $('total').textContent = res.total ? '(' + res.total + ' total)' : '';
      if (!res.items.length) { $('list').className = 'empty'; $('list').textContent = 'Belum ada data.'; return; }
      $('list').className = '';
      $('list').innerHTML = res.items.map(function (it) {
        return '<div class="item"><b>' + rupiah(it.nominal) + '</b>' +
          '<div>MP: ' + esc(it.noMP) + ' · EK: ' + esc(it.noEK) + '</div>' +
          '<div class="meta">' + esc(it.tanggal) + (it.link ? ' · <a href="' + esc(it.link) + '" target="_blank" rel="noopener">foto</a>' : '') + '</div></div>';
      }).join('');
    }).getRecent(10);
  }
  loadRecent();
</script>
</body>
</html>
