<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Asuransi</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7385; --line:#dfe3ee;
    --primary:#1a56db; --primary-d:#1445b3; --ok:#0f8a4b; --warn:#b45309; --err:#c81e1e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:980px; margin:0 auto; padding:16px; }
  h1 { font-size:1.25rem; margin:8px 0 2px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  #form { max-width:560px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  label small { font-weight:400; color:var(--muted); }
  label .req { color:var(--err); }
  input[type=text], input[type=tel], input[type=search] {
    width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text);
  }
  input:focus { outline:2px solid var(--primary); border-color:transparent; }
  .rp { position:relative; }
  .rp span { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; }
  .rp input { padding-left:42px; }

  .photo-box { border:2px dashed var(--line); border-radius:12px; padding:16px; text-align:center; color:var(--muted); cursor:pointer; }
  .photo-box.has { border-style:solid; cursor:default; }
  .photo-box img { max-width:100%; max-height:260px; border-radius:8px; display:block; margin:0 auto 10px; }
  .photo-actions { display:flex; gap:8px; justify-content:center; }

  button { font-family:inherit; cursor:pointer; }
  .primary { width:100%; margin-top:18px; padding:14px; font-size:1rem; font-weight:700; color:#fff; background:var(--primary); border:0; border-radius:10px; }
  .primary:hover { background:var(--primary-d); }
  .primary:disabled { opacity:.6; cursor:wait; }
  .sm { padding:8px 14px; font-size:.85rem; font-weight:600; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--text); }
  .sm:hover { background:#f1f3f9; }
  .sm.danger { color:var(--err); border-color:#f3c4c4; }
  .sm.danger:hover { background:#fdecec; }
  .sm.go { background:var(--primary); color:#fff; border-color:var(--primary); }
  .sm.go:hover { background:var(--primary-d); }
  .sm:disabled { opacity:.6; cursor:wait; }

  .msg { margin-top:12px; padding:10px 12px; border-radius:10px; font-size:.9rem; display:none; }
  .msg.ok { display:block; background:#e6f6ee; color:var(--ok); }
  .msg.err { display:block; background:#fdecec; color:var(--err); }
  .msg.warn { display:block; background:#fff4e0; color:var(--warn); }

  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .head h2 { font-size:1rem; margin:0; }
  .head .links a { font-size:.85rem; color:var(--primary); text-decoration:none; margin-left:12px; }
  .tools { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .tools input[type=search] { flex:1; min-width:180px; padding:10px 12px; font-size:.95rem; }
  .tools label { margin:0; font-weight:500; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .summary { color:var(--muted); font-size:.85rem; margin-bottom:8px; }

  .tbl-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; min-width:720px; font-size:.9rem; }
  th, td { padding:10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { background:#f1f3f9; font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; }
  tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.date { white-space:nowrap; color:var(--muted); font-size:.82rem; }
  .thumb { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; background:#eef0f6; }
  .nophoto { color:var(--muted); font-size:.8rem; }
  .ek-cell { display:flex; gap:6px; align-items:center; }
  .ek-cell input { padding:8px 10px; font-size:.9rem; min-width:150px; }
  .ek-cell .flash { font-size:.8rem; color:var(--ok); white-space:nowrap; }
  .ek-cell .flash.err { color:var(--err); }
  .empty { color:var(--muted); font-size:.9rem; padding:12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Report Asuransi</h1>
  <div class="sub">Data yang diinput langsung masuk ke Google Sheet.</div>

  <form id="form" class="card" autocomplete="off">
    <label>Foto <small>(boleh dikosongkan)</small></label>
    <div class="photo-box" id="photoBox"></div>
    <input type="file" id="photo" accept="image/*" hidden>

    <label for="nominal">Nominal <span class="req">*</span></label>
    <div class="rp"><span>Rp</span><input type="tel" id="nominal" inputmode="numeric" placeholder="0"></div>

    <label for="noMP">No Pesanan MP <span class="req">*</span></label>
    <input type="text" id="noMP" placeholder="mis. 2410150ABCDEF">

    <label for="noEK">No Invoice EK <small>(boleh dikosongkan, bisa diisi nanti)</small></label>
    <input type="text" id="noEK" placeholder="mis. EK-123456">

    <button type="submit" id="btn" class="primary">Simpan ke Sheet</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="card">
    <div class="head">
      <h2>Semua data</h2>
      <div class="links">
        <a href="#" id="reload">Muat ulang</a>
        <a href="https://docs.google.com/spreadsheets/d/14FIH5zkBPqYbOO_vi2Hgx-R1HBgmnmQPeAjnm6S8Mtw/edit" target="_blank" rel="noopener">Buka Sheet</a>
      </div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Cari No MP atau No EK…">
      <label><input type="checkbox" id="onlyNoEK"> Hanya yang EK-nya kosong</label>
    </div>
    <div class="summary" id="summary"></div>
    <div id="list" class="empty">Memuat…</div>
  </div>
</div>

<script>
  var photoData = null;   // {base64, mime, dataUrl}
  var allItems = [];
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function rupiah(n) { return 'Rp' + Number(n).toLocaleString('id-ID'); }
  function show(text, type) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + type; }

  // ================= FOTO (opsional: pilih, ganti, hapus) =================
  function renderPhotoBox() {
    var box = $('photoBox');
    if (photoData) {
      box.className = 'photo-box has';
      box.innerHTML = '<img src="' + photoData.dataUrl + '" alt="Foto">' +
        '<div class="photo-actions">' +
        '<button type="button" class="sm" id="photoChange">Ganti foto</button>' +
        '<button type="button" class="sm danger" id="photoRemove">✕ Hapus foto</button></div>';
      $('photoChange').onclick = function () { $('photo').click(); };
      $('photoRemove').onclick = function () { clearPhoto(); };
    } else {
      box.className = 'photo-box';
      box.innerHTML = '<div>Ketuk untuk ambil foto / pilih dari galeri</div>';
    }
  }
  function clearPhoto() {
    photoData = null;
    $('photo').value = '';
    renderPhotoBox();
  }
  $('photoBox').addEventListener('click', function () { if (!photoData) $('photo').click(); });
  $('photo').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    compressImage(f, 1280, 0.8).then(function (res) {
      photoData = res;
      renderPhotoBox();
    }).catch(function () { show('Foto tidak bisa dibaca, coba foto lain.', 'err'); });
  });
  function compressImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var w = img.width, h = img.height, s = Math.min(1, maxSide / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var dataUrl = c.toDataURL('image/jpeg', quality);
          resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  renderPhotoBox();

  // ================= NOMINAL (format ribuan) =================
  $('nominal').addEventListener('input', function () {
    var d = this.value.replace(/\D/g, '');
    this.value = d ? Number(d).toLocaleString('id-ID') : '';
  });
  function nominalValue() { return Number($('nominal').value.replace(/\D/g, '')); }

  // ================= SIMPAN DATA BARU =================
  function resetBtn() { $('btn').disabled = false; $('btn').textContent = 'Simpan ke Sheet'; }
  function fail(err) { resetBtn(); show('Gagal menyimpan: ' + (err && err.message ? err.message : err), 'err'); }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('msg').className = 'msg';
    var nominal = nominalValue();
    var noMP = $('noMP').value.trim();
    var noEK = $('noEK').value.trim();
    if (!nominal) return show('Nominal wajib diisi.', 'err');
    if (!noMP) return show('No Pesanan MP wajib diisi.', 'err');

    $('btn').disabled = true; $('btn').textContent = 'Memeriksa…';

    google.script.run
      .withFailureHandler(fail)
      .withSuccessHandler(function (dup) {
        if (dup.mp || dup.ek) {
          var what = (dup.mp ? 'No Pesanan MP' : '') + (dup.mp && dup.ek ? ' dan ' : '') + (dup.ek ? 'No Invoice EK' : '');
          if (!confirm(what + ' ini sudah pernah diinput. Tetap simpan?')) {
            resetBtn(); return show('Dibatalkan, data tidak disimpan.', 'warn');
          }
        }
        $('btn').textContent = photoData ? 'Mengunggah foto…' : 'Menyimpan…';
        google.script.run
          .withFailureHandler(fail)
          .withSuccessHandler(function () {
            show('Tersimpan ke Google Sheet ✔', 'ok');
            $('form').reset(); clearPhoto();
            resetBtn(); loadAll();
          })
          .saveEntry({
            nominal: nominal, noMP: noMP, noEK: noEK,
            photoBase64: photoData ? photoData.base64 : '',
            mime: photoData ? photoData.mime : ''
          });
      })
      .checkDuplicate(noMP, noEK);
  });

  // ================= TABEL SEMUA DATA =================
  function loadAll() {
    $('list').className = 'empty'; $('list').textContent = 'Memuat…';
    google.script.run
      .withFailureHandler(function () { $('list').textContent = 'Tidak bisa memuat data.'; })
      .withSuccessHandler(function (res) { allItems = res.items || []; renderTable(); })
      .getAll();
  }
  $('reload').addEventListener('click', function (e) { e.preventDefault(); loadAll(); });
  $('q').addEventListener('input', renderTable);
  $('onlyNoEK').addEventListener('change', renderTable);

  function filtered() {
    var q = $('q').value.trim().toLowerCase();
    var only = $('onlyNoEK').checked;
    return allItems.filter(function (it) {
      if (only && it.noEK) return false;
      if (q && it.noMP.toLowerCase().indexOf(q) < 0 && it.noEK.toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function renderTable() {
    var items = filtered();
    var sum = items.reduce(function (a, it) { return a + it.nominal; }, 0);
    var kosong = allItems.filter(function (it) { return !it.noEK; }).length;
    $('summary').textContent = allItems.length
      ? items.length + ' dari ' + allItems.length + ' data · Total ' + rupiah(sum) + ' · EK belum diisi: ' + kosong
      : '';
    if (!items.length) {
      $('list').className = 'empty';
      $('list').textContent = allItems.length ? 'Tidak ada data yang cocok.' : 'Belum ada data.';
      return;
    }
    $('list').className = '';
    var rows = items.map(function (it) {
      var foto = it.fileId
        ? '<a href="' + esc(it.link) + '" target="_blank" rel="noopener"><img class="thumb" loading="lazy" alt="Foto" src="https://drive.google.com/thumbnail?id=' + esc(it.fileId) + '&sz=w200"></a>'
        : '<span class="nophoto">Tanpa foto</span>';
      return '<tr>' +
        '<td>' + foto + '</td>' +
        '<td class="date">' + esc(it.tanggal) + '</td>' +
        '<td class="num">' + rupiah(it.nominal) + '</td>' +
        '<td>' + esc(it.noMP) + '</td>' +
        '<td><div class="ek-cell">' +
          '<input type="text" class="ek" placeholder="Isi No EK" value="' + esc(it.noEK) + '"' +
          ' data-row="' + it.row + '" data-mp="' + esc(it.noMP) + '" data-orig="' + esc(it.noEK) + '">' +
          '<button type="button" class="sm go ek-save" hidden>Simpan</button>' +
          '<span class="flash"></span></div></td>' +
        '</tr>';
    }).join('');
    $('list').innerHTML = '<div class="tbl-wrap"><table><thead><tr>' +
      '<th>Foto</th><th>Tanggal</th><th class="num">Nominal</th><th>No Pesanan MP</th><th>No Invoice EK</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // ---- Edit No Invoice EK langsung di tabel ----
  function ekParts(el) {
    var cell = el.closest('.ek-cell');
    return { cell: cell, input: cell.querySelector('.ek'), btn: cell.querySelector('.ek-save'), flash: cell.querySelector('.flash') };
  }
  $('list').addEventListener('input', function (e) {
    if (!e.target.classList.contains('ek')) return;
    var p = ekParts(e.target);
    p.btn.hidden = (p.input.value.trim() === p.input.getAttribute('data-orig'));
    p.flash.textContent = '';
  });
  $('list').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.classList.contains('ek')) {
      e.preventDefault();
      var p = ekParts(e.target);
      if (!p.btn.hidden) saveEK(p, false);
    }
  });
  $('list').addEventListener('click', function (e) {
    if (e.target.classList.contains('ek-save')) saveEK(ekParts(e.target), false);
  });

  function saveEK(p, force) {
    var inp = p.input;
    var row = Number(inp.getAttribute('data-row'));
    var mp = inp.getAttribute('data-mp');
    var val = inp.value.trim();
    p.btn.disabled = true; inp.disabled = true;
    p.flash.className = 'flash'; p.flash.textContent = 'Menyimpan…';

    google.script.run
      .withFailureHandler(function (err) {
        p.btn.disabled = false; inp.disabled = false;
        p.flash.className = 'flash err';
        p.flash.textContent = (err && err.message) ? err.message : 'Gagal menyimpan';
      })
      .withSuccessHandler(function (res) {
        p.btn.disabled = false; inp.disabled = false;
        if (res.dup) {
          if (confirm('No Invoice EK "' + val + '" sudah dipakai di data lain. Tetap simpan?')) {
            return saveEK(p, true);
          }
          p.flash.textContent = '';
          return;
        }
        inp.value = res.noEK;
        inp.setAttribute('data-orig', res.noEK);
        p.btn.hidden = true;
        p.flash.className = 'flash'; p.flash.textContent = 'Tersimpan ✔';
        allItems.forEach(function (it) { if (it.row === row) it.noEK = res.noEK; });
        var kosong = allItems.filter(function (it) { return !it.noEK; }).length;
        $('summary').textContent = $('summary').textContent.replace(/EK belum diisi: \d+/, 'EK belum diisi: ' + kosong);
      })
      .updateEK(row, mp, val, !!force);
  }

  loadAll();
</script>
</body>
</html>
